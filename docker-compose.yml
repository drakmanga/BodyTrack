services:
  postgres:
    image: postgres:16-alpine
    container_name: bodytrack-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bodytrack}
      POSTGRES_USER: ${DB_USER:-bodytrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bodytrack}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bodytrack-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bodytrack} -d ${DB_NAME:-bodytrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bodytrack-postgres-dev-data:
